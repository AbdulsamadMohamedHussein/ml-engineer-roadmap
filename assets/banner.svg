<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Machine Learning Engineer Roadmap, November 2026 to November 2028">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="2" fill="none">
    <line x1="930" y1="70" x2="1010" y2="130"/><line x1="930" y1="70" x2="1010" y2="210"/>
    <line x1="930" y1="190" x2="1010" y2="130"/><line x1="930" y1="190" x2="1010" y2="210"/>
    <line x1="930" y1="250" x2="1010" y2="130"/><line x1="930" y1="250" x2="1010" y2="210"/>
    <line x1="1010" y1="130" x2="1090" y2="170"/><line x1="1010" y1="210" x2="1090" y2="170"/>
  </g>
  <g fill="#38bdf8"><circle cx="930" cy="70" r="11"/><circle cx="930" cy="190" r="11"/><circle cx="930" cy="250" r="11"/></g>
  <g fill="#a78bfa"><circle cx="1010" cy="130" r="11"/><circle cx="1010" cy="210" r="11"/></g>
  <circle cx="1090" cy="170" r="14" fill="#f472b6"/>
  <text x="60" y="95" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#94a3b8">THE 24-MONTH JOURNEY</text>
  <text x="60" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="url(#accent)">Machine Learning Engineer</text>
  <text x="60" y="225" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e2e8f0">From AI student to hired, built in public.</text>
  <rect x="60" y="248" width="150" height="38" rx="19" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8"/>
  <text x="135" y="273" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#7dd3fc">NOV 2026</text>
  <text x="235" y="274" font-family="'Courier New', Consolas, monospace" font-size="22" fill="#94a3b8">&#8594;</text>
  <rect x="270" y="248" width="150" height="38" rx="19" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa"/>
  <text x="345" y="273" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#c4b5fd">NOV 2028</text>
</svg>
